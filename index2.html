<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevBoard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo">D</div>
      <div>Dev<span class="thin" style="color:inherit;font-weight:800;">Board</span></div>
    </div>
    <div class="topbar-right">
      <button id="colorToggleBtn" aria-label="Change background color" title="Change background color"></button>
    </div>
  </header>

  <div class="board">
    <div class="board-main">
      <div class="board-header">
        <div class="assigned-card">
          <div class="check">✓</div>
          <div>
            <div class="label">Task Assigned</div>
            <div class="value" id="taskCount">05</div>
          </div>
        </div>

        <button class="discover-banner" id="discoverBtn">
          <div class="emoji">📘</div>
          <div class="title">Discover Something<br>New Today!</div>
        </button>

        <div class="date-card">
          <div>
            <div class="dow" id="dowLabel">Sun</div>
            <div class="dfull" id="dateLabel">Sep 20, 2026</div>
          </div>
          <div class="cal">🗓</div>
        </div>
      </div>

      <div class="task-grid" id="taskGrid">
        <!-- Task cards injected by script.js -->
      </div>
    </div>

    <aside class="activity-panel">
      <h3>🕘 Activity Log</h3>
      <button class="clear-history" id="clearHistoryBtn">Clear History</button>
      <div id="logList">
        <div class="log-empty">No activity yet.</div>
      </div>
    </aside>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="quiz-overlay" id="quizOverlay">
  <div class="quiz-panel">
    <button class="quiz-close" id="quizClose" aria-label="Close">✕</button>
    <h2>Discover Something New Today!</h2>
    <div class="sub">A few DOM concepts worth knowing</div>
    <div id="qaList"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
